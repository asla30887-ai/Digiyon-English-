["B1","The Missed Train","Daniel woke up late and realised he had only fifteen minutes to reach the station. He ran through the streets, but the train was already leaving when he arrived. Instead of panicking, he checked the timetable and found another train an hour later. He used the time to call his manager and explain the delay. When he finally arrived, the meeting had barely started, and nobody seemed upset.",[["Why was Daniel in a hurry?","He woke up late|His car broke down|He lost his ticket",0],["What happened at the station?","The train was cancelled|The train was leaving|The station was closed",1],["What did he do instead of panicking?","Went home|Checked the timetable|Took a taxi",1],["Who did he call?","His manager|His wife|A friend",0],["How was the situation at the end?","Nobody was upset|He lost his job|The meeting was cancelled",0]]],
["B1","Moving to a New City","When Huda moved to a new city for work, she knew nobody there. The first weeks were lonely, and she often missed her family. Then she joined a local walking group and started to meet people with similar interests. Gradually, the city began to feel like home. Now she says that the hardest part was simply taking the first step.",[["Why did Huda move?","For work|For study|For marriage",0],["How did she feel at first?","Excited|Lonely|Angry",1],["What did she join?","A gym|A walking group|A school",1],["What changed over time?","She felt at home|She went back|She changed jobs",0],["What was the hardest part?","The weather|The first step|The work",1]]],
["B2","Life Without Internet","When a storm destroyed the cables in a small coastal town, residents lost internet access for nine days. At first, businesses panicked because they relied on online payments. However, people soon rediscovered face-to-face conversation, and the local café was busier than it had been in years. Although most were relieved when the connection returned, several admitted they had been more productive and less anxious during the outage.",[["What caused the outage?","A storm|A strike|A power cut",0],["How long did it last?","Three days|Nine days|Two weeks",1],["Why did businesses panic?","They relied on online payments|They had no staff|Prices rose",0],["What became busier?","The post office|The café|The school",1],["How did several people feel afterwards?","More anxious|More productive|Bored",1]]],
["B2","The Marathon","Layla had never run more than five kilometres when she decided to enter a marathon. She followed a strict training plan for six months, even though it meant waking before dawn. Halfway through the race, her knee began to hurt, and she seriously considered quitting. Yet the crowd's encouragement convinced her to continue, and she crossed the finish line exhausted but proud.",[["What was Layla's longest run before?","Five kilometres|Ten kilometres|Twenty kilometres",0],["How long did she train?","Three months|Six months|One year",1],["What problem occurred during the race?","Her knee hurt|She got lost|She fell ill",0],["What made her continue?","Her coach|The crowd|A prize",1],["How did she feel at the end?","Exhausted but proud|Disappointed|Angry",0]]],
["C1","The Paradox of Choice","Contrary to intuition, an abundance of options does not necessarily make people happier. Psychologists argue that when faced with too many alternatives, individuals experience decision fatigue and are more prone to regret, since they imagine the superior outcomes they might have secured. Consequently, some deliberately limit their choices, adopting routines that conserve mental energy for genuinely consequential decisions.",[["What is the main claim?","More choice always brings happiness|Too many options can reduce satisfaction|Choice is irrelevant",1],["What do people experience with many alternatives?","Decision fatigue|Increased energy|Less regret",0],["Why is regret more likely?","They imagine better outcomes|They choose quickly|They have fewer options",0],["What do some people deliberately do?","Increase options|Limit their choices|Avoid decisions entirely",1],["Why adopt routines?","To save mental energy|To impress others|To spend less",0]]],
["C1","The Translator's Dilemma","A skilled translator must reconcile fidelity to the source with fluency in the target language. A rigidly literal rendering may preserve the author's phrasing yet sound unnatural, whereas a free adaptation risks distorting nuance. Experienced practitioners therefore treat each sentence as a negotiation, weighing cultural connotations, register and rhythm before committing to a solution that inevitably sacrifices something.",[["What must a translator balance?","Speed and cost|Fidelity and fluency|Grammar and spelling",1],["What is a risk of literal translation?","It sounds unnatural|It is too short|It is inaccurate always",0],["What is a risk of free adaptation?","It is too slow|It distorts nuance|It is literal",1],["How do experts treat each sentence?","As a negotiation|As a rule|As a guess",0],["What is inevitable?","Perfection|Some sacrifice|Agreement",1]]],

["A2", "The Birthday Surprise", "Yusuf's friends planned a surprise party for his birthday. They hid in his flat while his sister took him to dinner. When he came back, everyone shouted 'Happy birthday!' Yusuf was shocked because he thought they had forgotten. He laughed and thanked them for the cake.", [["What did the friends plan?", "A surprise party|A trip|A film night", 0], ["Where did they hide?", "In a restaurant|In Yusuf's flat|In the garden", 1], ["Who took Yusuf to dinner?", "His mother|His sister|His boss", 1], ["Why was he shocked?", "He lost his keys|He thought they had forgotten|He was tired", 1], ["What did he thank them for?", "The flowers|The money|The cake", 2]]],

["A2", "Late for School", "Maya's alarm did not ring this morning, so she woke up at eight. School starts at eight thirty, and it takes forty minutes to get there by bus. She grabbed her bag and ran to the bus stop without breakfast. In the end she arrived ten minutes late, and her teacher was not happy.", [["What did not ring?", "Her door|Her alarm|Her phone", 1], ["When does school start?", "8:00|8:30|9:00", 1], ["How long is the bus trip?", "40 minutes|20 minutes|One hour", 0], ["What did she skip?", "Breakfast|Lunch|Homework", 0], ["How late was she?", "Ten minutes|Twenty minutes|Forty minutes", 0]]],
["A2", "A Day at the Zoo", "We took the children to the zoo on Sunday. The elephants were their favourite animals because they were so big. We also saw monkeys, which were very funny. At lunchtime, we ate sandwiches near the lake. It started to rain at four, so we went home earlier than planned.", [["When did they go?", "Saturday|Sunday|Friday", 1], ["Which animals were the favourite?", "Monkeys|Elephants|Lions", 1], ["Why were they the favourite?", "They were big|They were fast|They were small", 0], ["Where did they eat?", "In a café|Near the lake|On the bus", 1], ["Why did they go home early?", "The zoo closed|It started to rain|The children were tired", 1]]],

["A2", "Visiting Grandma", "Every summer we visit my grandma in the countryside. She lives in a small village near the mountains. Her house has a big garden with apple trees. In the mornings she bakes bread, and the smell fills the whole house. I always feel relaxed there.", [["When do they visit?", "Every winter|Every summer|Every month", 1], ["Where does she live?", "By the sea|In a big city|In a village", 2], ["Which trees are in the garden?", "Orange|Olive|Apple", 2], ["What does she bake?", "Cakes|Bread|Biscuits", 1], ["How does the writer feel there?", "Relaxed|Bored|Nervous", 0]]],
["A2", "The Job Interview", "Hana had an interview for a job at a bookshop. She wore her best suit and arrived fifteen minutes early. The manager asked why she wanted the job, and she said she loved reading. She had also worked in a library for two years. Two days later, he called to offer her the job.", [["What kind of shop was it?", "A bakery|A clothes shop|A bookshop", 2], ["When did she arrive?", "Fifteen minutes early|On time|Late", 0], ["Why did she want the job?", "She needed money|She loved reading|Her friend worked there", 1], ["Where had she worked before?", "A school|A library|A café", 1], ["What happened two days later?", "He refused her|He offered her the job|He sent an email", 1]]],
["B1", "A Difficult Decision", "Samir was offered a better job in another country. The salary was higher, but he would have to leave his elderly parents. He spent a week discussing it with his family. In the end, his father encouraged him to accept, promising to visit twice a year. Samir signed the contract with mixed feelings.", [["What was he offered?", "A better job abroad|A scholarship|A house", 0], ["Why was it hard?", "Low salary|He would leave his parents|He disliked travel", 1], ["How long did he discuss it?", "A day|A week|A month", 1], ["Who encouraged him?", "His father|His boss|His friend", 0], ["How did he feel?", "Mixed feelings|Totally happy|Angry", 0]]],
["B1", "The Old Photograph", "While cleaning the attic, Rana found an old photograph of her grandparents in front of a shop. On the back, someone had written a date and a name she did not recognise. Her aunt explained that the shop had belonged to the family before the war. Rana decided to research her family history.", [["Where did she find it?", "In the attic|In a book|In a shop", 0], ["Who is in the photograph?", "Her parents|Her grandparents|Her aunt", 1], ["What was on the back?", "A date and a name|A poem|Nothing", 0], ["Who explained about the shop?", "Her aunt|Her mother|A neighbour", 0], ["What did Rana decide?", "To sell it|To research her family history|To throw it away", 1]]],
["B1", "A Stranger’s Kindness", "Tariq missed his last bus and realised he had left his wallet at the office. It was raining, and he had no money for a taxi. An elderly woman noticed him waiting and offered him a lift. She drove him home without accepting anything. Tariq later left a thank-you note at the café where she worked.", [["What did Tariq forget?", "His phone|His wallet|His keys", 1], ["What was the weather?", "Rainy|Sunny|Windy", 0], ["Who helped him?", "A taxi driver|An elderly woman|A policeman", 1], ["Did she accept payment?", "Yes|No|Only a little", 1], ["Where did he leave the note?", "At the café|At her house|At the office", 0]]],
["B1", "Learning to Swim", "At thirty, Nadia still could not swim, and she felt embarrassed about it. She signed up for beginner lessons at the local pool. The first lesson was frightening because she was afraid of deep water. However, her instructor was patient, and after two months she could swim a full length. Now she goes to the pool every week.", [["How old is Nadia?", "Thirty|Twenty|Forty", 0], ["How did she feel about not swimming?", "Proud|Embarrassed|Bored", 1], ["What frightened her?", "Deep water|The instructor|Cold water", 0], ["How long until she swam a length?", "Two weeks|Two months|Two years", 1], ["How often does she swim now?", "Every week|Every day|Never", 0]]],
["B1", "The Summer Job", "During the summer holidays, Omar worked in an ice-cream shop to save money for university. The hours were long, and customers could be rude. Nevertheless, he learned how to manage his time and stay calm under pressure. By September he had saved enough to pay for his books.", [["Where did he work?", "A café|An ice-cream shop|A bank", 1], ["Why did he work?", "To save for university|For fun|To travel", 0], ["What was difficult?", "Long hours and rude customers|The salary|The boss", 0], ["What did he learn?", "Cooking|To manage time and stay calm|To drive", 1], ["What did the money pay for?", "His books|His flight|His rent", 0]]],
["B1", "An Unexpected Visitor", "Late one evening, the doorbell rang, and Hala found her cousin standing outside with a suitcase. He had not told anyone he was coming because he wanted to surprise her. Although she had a busy week at work, she happily made up the spare bed. They talked until midnight about old times.", [["When did the bell ring?", "In the morning|Late in the evening|At noon", 1], ["Who was at the door?", "Her cousin|Her brother|A stranger", 0], ["Why had he not warned anyone?", "He forgot|He wanted to surprise her|He had no phone", 1], ["What did Hala prepare?", "Dinner|The spare bed|A taxi", 1], ["What did they do?", "Talked about old times|Watched a film|Went out", 0]]],
["B1", "The Power Cut", "Last winter the whole neighbourhood lost electricity for six hours. Families lit candles and gathered in the street, where neighbours who had barely spoken began chatting. Someone brought a gas stove and made tea for everyone. When the lights returned, many people felt almost sorry that the evening was over.", [["How long was the power cut?", "Two hours|Six hours|A day", 1], ["Which season was it?", "Winter|Summer|Spring", 0], ["What did families light?", "Candles|Fires|Torches", 0], ["Who made tea?", "Someone with a gas stove|The council|A café", 0], ["How did people feel at the end?", "Almost sorry it was over|Relieved only|Angry", 0]]],
["B1", "A Dream Come True", "Since childhood, Lina had dreamed of becoming a pilot. Her parents thought it was too expensive, so she worked part-time for years to pay for lessons. After many exams and sleepless nights, she finally earned her licence. On her first flight, she looked down at the clouds and could hardly believe it was real.", [["What was her dream?", "To be a pilot|To be a doctor|To be a teacher", 0], ["Why did she work part-time?", "To pay for lessons|To meet people|To travel", 0], ["What did she earn?", "A licence|A medal|A scholarship", 0], ["What did her parents think?", "Too expensive|Too dangerous|A great idea", 0], ["How did she feel on her first flight?", "She could hardly believe it|Scared|Bored", 0]]],
["B2", "The Whistleblower", "When Daniel discovered that his company was hiding safety problems in its products, he faced a dilemma. Reporting it might cost him his career, yet silence could endanger thousands of customers. After weeks of sleepless nights, he contacted a journalist. The scandal forced the company to recall its products, although Daniel was dismissed shortly afterwards.", [["What did Daniel discover?", "Hidden safety problems|Fraud in the accounts|Illegal pricing", 0], ["What was the risk of reporting?", "Losing his career|A fine|Moving abroad", 0], ["Who did he contact?", "A lawyer|A journalist|The police", 1], ["What did the company have to do?", "Close down|Recall its products|Change its name", 1], ["What happened to Daniel?", "He was promoted|He was dismissed|He resigned happily", 1]]],
["B2", "A Second Chance", "After leaving university without a degree, Hamza drifted between low-paid jobs for almost a decade. At thirty-two he enrolled in an evening course, struggling to balance study with exhaustion. Many classmates were younger and more confident, which initially unsettled him. Nevertheless, he graduated with distinction, proving that it was never too late to change direction.", [["How long did he drift between jobs?", "Almost ten years|Two years|Five years", 0], ["How old was he when he enrolled?", "Twenty-two|Thirty-two|Forty-two", 1], ["What made study hard?", "Balancing it with exhaustion|Lack of money|Distance", 0], ["How did younger classmates affect him?", "They unsettled him at first|They helped him|He ignored them", 0], ["How did he graduate?", "With distinction|Barely|He did not", 0]]],
["B2", "The Art Forger", "For years, the gallery's most valued painting hung unquestioned until a restorer noticed pigments that did not exist in the seventeenth century. Laboratory tests confirmed that it was a skilful forgery produced decades earlier. The revelation embarrassed the experts who had authenticated it, and raised uncomfortable questions about how much the art market trusts reputation rather than evidence.", [["What did the restorer notice?", "A signature|Modern pigments|A crack", 1], ["What did tests confirm?", "It was a skilful forgery|It was genuine|It was stolen", 0], ["Who was embarrassed?", "The experts who authenticated it|The restorer|The thieves", 0], ["What does the market trust too much?", "Evidence|Reputation|Price", 1], ["How long had it hung unquestioned?", "For years|Days|Weeks", 0]]],
["B2", "Climate on the Farm", "Farmers in the valley have noticed that spring now arrives earlier, and droughts last longer than they did a generation ago. Rather than abandoning their land, many have switched to drought-resistant crops and installed drip irrigation. Although these measures require heavy investment, the farmers argue that adapting is cheaper than losing entire harvests.", [["What has changed about spring?", "It arrives earlier|It is colder|It is shorter", 0], ["What about droughts?", "They last longer|They are rarer|They are the same", 0], ["What did farmers switch to?", "Drought-resistant crops|Livestock|Rice", 0], ["What is the drawback?", "Heavy investment|Poor results|New laws", 0], ["Why do they say it is worth it?", "Adapting is cheaper than losing harvests|The government pays|It is easy", 0]]],
["B2", "The Startup", "Two friends launched a food-delivery app from a tiny flat, working eighteen hours a day. Initially, investors dismissed it as unoriginal, and they nearly ran out of money. Their breakthrough came when they focused on small family restaurants ignored by competitors. Within two years, the company had expanded to five cities.", [["What did they launch?", "A food-delivery app|A shop|A game", 0], ["Where did they start?", "A tiny flat|An office|A garage", 0], ["How did investors react?", "They dismissed it|They loved it|They ignored it", 0], ["What was the breakthrough?", "Focusing on small family restaurants|Lower prices|Advertising", 0], ["How many cities within two years?", "Two|Five|Ten", 1]]],
["B2", "Lost in the Desert", "The hikers underestimated the desert, setting out with only two litres of water each. By the second afternoon, they had lost the trail, and their phones had no signal. They decided to stay beside a large rock, where rescuers would find them more easily. A helicopter spotted them the next morning, dehydrated but alive.", [["How much water did each take?", "Two litres|Five litres|One litre", 0], ["What happened on the second afternoon?", "They lost the trail|A storm began|Someone was injured", 0], ["Why could they not call?", "No signal|Broken phones|No battery", 0], ["What did they decide?", "To stay beside a rock|To keep walking|To split up", 0], ["How were they found?", "By helicopter|By another hiker|By car", 0]]],
["B2", "The Last Letter", "Among her late father's belongings, Salma discovered an unsent letter addressed to her. In it, he apologised for working so much during her childhood and described how proud he was of her. She read it several times, tears blurring the words. Although it could not change the past, it gave her a sense of closure she had long been seeking.", [["Where did she find the letter?", "Among her father's belongings|In a bank|In the post", 0], ["Who was it addressed to?", "Salma|Her mother|A friend", 0], ["What did he apologise for?", "Working so much|Leaving|Lying", 0], ["How did she react?", "With tears|With anger|Indifferently", 0], ["What did it give her?", "Closure|Money|Anger", 0]]],
["B2", "A Question of Trust", "After discovering that her business partner had secretly sold shares, Reem struggled to decide whether to forgive him. They had been friends for twenty years, and he claimed it was a desperate mistake. Nevertheless, she insisted on new contracts and strict oversight. Trust, she explained, can be rebuilt, but only through consistent actions rather than apologies.", [["What did the partner do?", "Secretly sold shares|Stole money|Quit", 0], ["How long had they been friends?", "Twenty years|Five years|Two years", 0], ["What did he claim?", "It was a desperate mistake|It was legal|It was her idea", 0], ["What did Reem insist on?", "New contracts and oversight|Ending the company|Nothing", 0], ["How can trust be rebuilt?", "Through consistent actions|Through apologies|Through time alone", 0]]],
["C1", "The Last Lighthouse Keeper", "Automation has rendered lighthouse keepers obsolete, yet the last one on the northern coast refuses to leave his post. He insists that sensors cannot replace the intuition acquired through decades of watching the sea. Authorities regard his stance as sentimental, but fishermen quietly admit that his warnings have, on occasion, proved more reliable than the instruments.", [["What made keepers obsolete?", "Automation|Budget cuts|War", 0], ["What does he refuse to do?", "Leave his post|Speak to the press|Use a radio", 0], ["What does he claim sensors lack?", "Intuition from decades of experience|Power|Accuracy", 0], ["How do authorities view his stance?", "As sentimental|As heroic|As dangerous", 0], ["What do fishermen admit?", "His warnings sometimes beat the instruments|He is wrong|They ignore him", 0]]],
["C1", "An Archive of Silence", "Historians increasingly recognise that what archives omit can be as revealing as what they contain. Records compiled by institutions inevitably reflect the priorities of those in power, leaving marginalised voices undocumented. Consequently, researchers have begun reading between the lines, treating absences as evidence in their own right and seeking oral testimony to fill the gaps.", [["What can be as revealing as contents?", "What is omitted|Dates|Handwriting", 0], ["Whose priorities do records reflect?", "Those in power|Historians|Readers", 0], ["Whose voices are missing?", "Marginalised ones|Officials|Kings", 0], ["How do researchers treat absences?", "As evidence|As errors|As noise", 0], ["What do they seek to fill gaps?", "Oral testimony|Newspapers|Maps", 0]]],

let DI="";
function dict(){const c=W.filter(w=>w.sent&&w.sent.split(" ").length>=4&&w.sent.split(" ").length<=12);DI=rn(c).sent;
$("v").innerHTML=`<div class="hcard sc"><b>✍️ إملاء</b><div class="mu">اسمع الجملة واكتبها. تقدر تعيد الاستماع.</div><div class="act"><button class="on" id="dp">🔊 استماع</button><button id="ds">🐢 بطيء</button></div></div><textarea id="dt" rows="3" dir="ltr" placeholder="اكتب ما سمعته…"></textarea><div class="act"><button class="on" id="dc">تحقق</button><button data-n="d">جملة جديدة</button></div><div id="dr"></div>`;setTimeout(()=>say(DI),300)}
function dslow(){if(!ttsOK()){netSay([DI],.6,true);return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(DI);u.lang="en-GB";u.rate=.5;speechSynthesis.speak(u)}catch(e){}}
function dcheck(){const n=x=>x.toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean),t=n(DI),u=n($("dt").value);let ok=0;
const h=t.map((w,i)=>{const g=u[i]===w||u.includes(w);if(g)ok++;return`<span class="${g?"ok":"no"}">${esc(w)}</span>`}).join(" ");
$("dr").innerHTML=`<div class="hcard sc"><div dir="ltr" style="text-align:left;font-size:18px">${h}</div><div class="tr">${Math.round(ok/t.length*100)}%</div><div class="mu">الأخضر صحيح والأحمر ناقص أو خاطئ.</div></div>`}
function chal(){const day=new Date().toISOString().slice(0,10),sv=ls.g("hubch",{pts:0,days:{}}),lvl=Math.floor(sv.pts/100)+1;
if(sv.days[day]!=null){$("v").innerHTML=`<div class="hcard sc"><b>🏆 أنجزت تحدّي اليوم!</b><div>نقاط اليوم: ${sv.days[day]}</div><div class="tr">المستوى ${lvl} · ${sv.pts} نقطة</div><div class="mu">${Object.keys(sv.days).length} يوم تحدٍّ · عُد غدًا لتحدٍّ جديد.</div></div>`;return}
const u=W.filter(w=>!S.known[w.num]).sort(()=>Math.random()-.5).slice(0,5),r=RDS[Math.floor(Date.now()/864e5)%RDS.length];
const wq=u.map(w=>{const o=[w.trans];while(o.length<3){const x=rn(W).trans;if(!o.includes(x))o.push(x)}o.sort(()=>Math.random()-.5);return['What does "'+w.word+'" mean?',o.join("|"),o.indexOf(w.trans)]});
$("v").innerHTML=`<div class="hcard sc"><b>🏆 تحدّي اليوم · 5 دقائق</b><div class="mu">5 كلمات + 3 أسئلة قراءة = 80 نقطة. المستوى الحالي ${lvl} (${sv.pts} نقطة)</div></div><div id="qz"></div><div class="hcard"><b dir="ltr">${esc(r.title)}</b><div class="en2">${esc(r.text)}</div></div><div id="qz2"></div>`;
let a=0,b=0,dn=0;const fin=()=>{if(++dn<2)return;const p=(a+b)*10;u.forEach(w=>{S.st[w.num]=S.st[w.num]||{b:0,d:Date.now()}});save();sv.days[day]=p;sv.pts+=p;ls.s("hubch",sv);$("qz2").lastElementChild.innerHTML=`<div class="hcard sc"><b>🎉 +${p} نقطة</b><div class="tr">المستوى ${Math.floor(sv.pts/100)+1}</div></div>`};
quiz(wq,$("qz"),k=>{a=k;fin()});quiz(r.q.slice(0,3),$("qz2"),k=>{b=k;fin()})}
async function aiGrade(kind){const fb=$("fb");if(!fb)return;if(!SMP){toast("التصحيح الآلي يعمل من الرابط المنشور داخل Claude");return}
const w=kind=="w",task=w?document.querySelector(".hcard pre").textContent:[...document.querySelectorAll("#pz pre")].map(x=>x.textContent).join(" | "),txt=(w?$("wt"):$("st")).value.trim();
if(txt.split(/\s+/).length<(w?30:10)){toast("اكتب أو تكلّم أكثر قليلًا");return}
fb.innerHTML='<div class="hcard">⏳ جارٍ التقييم…</div>';
try{const r=await SMP.json(`You are a strict IELTS ${w?"Writing":"Speaking"} examiner. Task: ${task}\n${w?"Candidate response":"Candidate transcript (speech-to-text; pronunciation cannot be judged precisely)"}:\n${txt}\nGive the overall band (0-9, half bands) and criteria bands, 3 strengths and 3 specific fixes in ARABIC, and "better": an improved rewrite of the first paragraph (or a stronger sample answer) in English. Return ONLY JSON {"band":"","parts":[{"n":"","b":""}],"good":[],"fix":[],"better":""}`);
fb.innerHTML=`<div class="hcard sc"><div class="tr" style="font-size:28px">Band ${esc(r.band)}</div>${(r.parts||[]).map(p=>`<div>${esc(p.n)}: <b>${esc(p.b)}</b></div>`).join("")}<b>✅ نقاط القوة</b>${(r.good||[]).map(x=>`<div>• ${esc(x)}</div>`).join("")}<b>🔧 للتحسين</b>${(r.fix||[]).map(x=>`<div>• ${esc(x)}</div>`).join("")}${r.better?`<b>✍️ نسخة محسّنة</b><div class="en2" style="font-size:16px">${esc(r.better)}</div>`:""}<div class="mu">تقييم تقديري وليس رسميًا.</div></div>`}catch(e){fb.innerHTML="";toast("تعذّر التقييم")}}
window.HUB={draw:go,open:t=>{tab=t;go()}};
})();
function hideRows(){const h=mode==="g";["lv","sec","fn","fa","pb","pt","gl","wd","bk","pl2"].forEach(id=>{const e=$(id);if(!e)return;const x=id==="pb"?e.parentNode:(e.closest(".row")||e);x.style.display=h?"none":""})}

let wm="c";
$("q").parentNode.id="qr";$("pb").parentNode.id="pbw";
const mo=document.createElement("div");mo.id="more";mo.innerHTML='<div class="mu" style="margin:4px 0 10px">الإعدادات والأدوات</div>';$("pbw").before(mo);
[$("sec"),$("fn"),$("fa"),$("bk"),$("pl2"),$("bp")].forEach(e=>mo.appendChild(e.closest(".row")||e));
[...$("tb").children].forEach(b=>{if(b.textContent.includes("إحصاءات")||b.textContent.includes("آيلتس"))b.style.display="none"});
const ob=build;build=function(){if(!["g","s","hm"].includes(mode))wm=mode;return ob.apply(this,arguments)};
function gonav(sec,m){document.body.dataset.sec=sec;if(sec==="h")mode="hm";else if(sec==="w")mode=m||wm;else if(sec==="g")mode="g";else if(sec==="s")mode="s";[...$("bn").children].forEach(b=>b.classList.toggle("on",b.dataset.s===sec));if(sec!=="m")build();scrollTo(0,0)}
$("bn").onclick=e=>{const b=e.target.closest("button");if(b)gonav(b.dataset.s)};
function homeView(){const due=Object.values(S.st||{}).filter(x=>x.d<=Date.now()).length,kn=Object.keys(S.known||{}).length,n=W.length;
$("v").innerHTML=`<button class="big on" data-a="w">▶ تابع تعلّم الكلمات<small>${n} كلمة · بطاقات</small></button><button class="big" data-a="r">🔁 مراجعة اليوم<small>${due} كلمة مستحقة</small></button><button class="big" data-a="s">📖 قصة جديدة<small>عشرات القصص بالمستويات A1–C1</small></button><button class="big" data-a="i">🎓 تمرين آيلتس<small>قراءة · استماع · كتابة · تحدث</small></button><div class="hcard"><b>تقدّمك</b><div class="bar"><i style="width:${kn/n*100}%"></i></div><div class="mu">${kn} من ${n} كلمة محفوظة</div></div>`}
$("v").addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;if(a==="w")gonav("w","c");else if(a==="r")gonav("w","r");else{gonav("g");HUB.open(a==="s"?"s":"r")}});
const thS=t=>{document.documentElement.dataset.theme=t};try{const t=localStorage.getItem("th");if(t)thS(t)}catch(e){}
$("th").onclick=()=>{const c=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),n=c==="dark"?"light":"dark";thS(n);try{localStorage.setItem("th",n)}catch(e){}};
document.body.dataset.sec="h";mode="hm";$("bn").children[0].classList.add("on");
lab();build();
</script>
